name: Android CI

# Enforces the AIRP Phase 3 quality gate on every PR and push to the default branch.
# Command parity with AGENTS.md section 2.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# A new push to the same PR cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # Guardrail: fail fast if credential material is committed.
  # Mirrors the "never bulk stage" rule in AGENTS.md section 5.
  # ---------------------------------------------------------------
  secret-guard:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Reject committed credentials and build output
        shell: bash
        run: |
          set -euo pipefail
          forbidden=$(git ls-files | grep -E '(^|/)(secrets|local|keystore|signing)\.properties$|\.(jks|keystore|p12|pem)$|google-services\.json$|^(app/)?build/|^app/release/|\.(apk|aab)$' || true)
          if [[ -n "$forbidden" ]]; then
            printf '%s\n' "::error::Forbidden credential or generated artifact is tracked:" "$forbidden"
            exit 1
          fi

  # ---------------------------------------------------------------
  # AIRP Phase 3, step 1: static analysis.
  # Split into its own job because lintAnalyzeDebug takes ~4 minutes and
  # would otherwise delay test feedback on every PR.
  # Baseline at time of writing: 91 issues, 0 errors (84 warnings, 7 hints).
  # ---------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Android build
        uses: ./.github/actions/setup-android-build
      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------
  # R8 release validation and deterministic emulator smoke coverage.
  # ---------------------------------------------------------------
  unit-test-and-release:
    name: Unit tests, R8, and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Android build
        uses: ./.github/actions/setup-android-build
      - name: Verify Gradle dependency checksums
        run: ./gradlew --dependency-verification=strict help --stacktrace
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Validate R8 release shrinker
        run: ./gradlew :app:minifyReleaseWithR8 --stacktrace
      - name: Build unsigned release bundle
        run: ./gradlew :app:bundleRelease --stacktrace
      - name: Upload test and release reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-and-r8-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/outputs/mapping/release/
          if-no-files-found: ignore
          retention-days: 14

  android-smoke:
    name: Android instrumentation smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Android build
        uses: ./.github/actions/setup-android-build
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", MODE="0666", GROUP="kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run deterministic device smoke tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: >-
            ./gradlew :app:connectedDebugAndroidTest --stacktrace
            --tests "com.example.tigerplayer.ExampleInstrumentedTest"
            --tests "com.example.tigerplayer.data.local.TigerDaoIntegrityTest"
      - name: Upload Android test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-smoke-report
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14

