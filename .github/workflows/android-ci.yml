name: Android CI

# Enforces the AIRP Phase 3 quality gate on every PR and push to the default branch.
# Command parity with AGENTS.md section 2.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# A new push to the same PR cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # Guardrail: fail fast if credential material is committed.
  # Mirrors the "never bulk stage" rule in AGENTS.md section 5.
  # ---------------------------------------------------------------
  secret-guard:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject committed credentials and build output
        shell: bash
        run: |
          set -euo pipefail
          forbidden=$(git ls-files | grep -E '(^|/)(secrets|local|keystore|signing)\.properties$|\.(jks|keystore|p12|pem)$|google-services\.json$|^(app/)?build/|^app/release/|\.(apk|aab)$' || true)
          if [[ -n "$forbidden" ]]; then
            printf '%s\n' "::error::Forbidden credential or generated artifact is tracked:" "$forbidden"
            exit 1
          fi
      - name: Verify Room database schema JSON exists
        shell: bash
        run: |
          set -euo pipefail
          db_file="app/src/main/java/com/tigerplayer/data/local/TigerDatabase.kt"
          db_version=$(sed -nE 's/.*version[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' "$db_file" | head -n1)
          if [[ -z "$db_version" ]]; then
            echo "::error::Could not determine Room database version from $db_file"
            exit 1
          fi
          schema_file="app/schemas/com.tigerplayer.data.local.TigerDatabase/${db_version}.json"
          if [[ ! -f "$schema_file" ]]; then
            echo "::error::Room schema file $schema_file missing for version $db_version!"
            exit 1
          fi
          echo "Verified Room schema file $schema_file exists for version $db_version."

  # ---------------------------------------------------------------
  # AIRP Phase 3, step 1: static analysis.
  # Split into its own job because lintAnalyzeDebug takes ~4 minutes and
  # would otherwise delay test feedback on every PR.
  # Baseline at time of writing: 91 issues, 0 errors (84 warnings, 7 hints).
  #
  # `lintDebug` became ambiguous once the foss/full flavor dimension was
  # added (app/build.gradle.kts) — Gradle now requires the flavor-qualified
  # task name. Lint both flavors: they compile different source sets
  # (src/foss vs src/full) and a lint error unique to one would otherwise
  # go unnoticed.
  # ---------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Android build
        uses: ./.github/actions/setup-android-build
      - name: Lint (foss)
        run: ./gradlew :app:lintFossDebug --stacktrace
      - name: Lint (full)
        run: ./gradlew :app:lintFullDebug --stacktrace
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------
  # R8 release validation and deterministic emulator smoke coverage.
  #
  # R8/bundle validation targets the `foss` flavor: it's the flavor with no
  # proprietary dependencies and no required secrets, so it's the
  # reproducible build F-Droid will actually run (see
  # docs/FDroid-Submission-Plan.md). Unit tests run for both flavors since
  # src/foss and src/full each carry flavor-specific code
  # (SpotifyAppRemoteClientImpl).
  # ---------------------------------------------------------------
  unit-test-and-release:
    name: Unit tests, R8, and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Android build
        uses: ./.github/actions/setup-android-build
      - name: Verify Gradle dependency checksums
        run: ./gradlew --dependency-verification=strict help --stacktrace
      - name: Unit tests (foss)
        run: ./gradlew :app:testFossDebugUnitTest --stacktrace
      - name: Unit tests (full)
        run: ./gradlew :app:testFullDebugUnitTest --stacktrace
      - name: Validate R8 release shrinker (foss)
        run: ./gradlew :app:minifyFossReleaseWithR8 --stacktrace
      - name: Build unsigned release bundle (foss)
        run: ./gradlew :app:bundleFossRelease --stacktrace
      - name: Verify no uncommitted Room schema drift
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain app/schemas)" ]]; then
            echo "::error::Uncommitted Room schema changes detected! Commit the generated schema JSON under app/schemas/."
            git status --porcelain app/schemas
            git diff app/schemas
            exit 1
          fi
      - name: Upload test and release reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-and-r8-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/outputs/mapping/fossRelease/
          if-no-files-found: ignore
          retention-days: 14

  android-smoke:
    name: Android instrumentation smoke
    # Temporarily deferred: the hosted emulator remains unreliable after KVM setup.
    # Re-enable after issue #99 establishes a stable device-test environment.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Android build
        uses: ./.github/actions/setup-android-build
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", MODE="0666", GROUP="kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run deterministic device smoke tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: >-
            ./gradlew :app:connectedFossDebugAndroidTest --stacktrace
            --tests "com.example.tigerplayer.ExampleInstrumentedTest"
            --tests "com.example.tigerplayer.data.local.TigerDaoIntegrityTest"
      - name: Upload Android test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-smoke-report
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14

