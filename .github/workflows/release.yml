name: Release candidate
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch, or tag to build.
        required: true
        default: master
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release-candidate:
    name: Build unsigned release candidate
    runs-on: ubuntu-latest
    environment: release-candidate
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-android-build
        with:
          cache-read-only: "false"
      - run: ./gradlew --dependency-verification=strict help --stacktrace
      # `full` is the distributable flavor for tagged releases (includes Spotify App Remote).
      # The reproducible `foss` build submitted to F-Droid is validated separately by
      # android-ci.yml and built directly by F-Droid's own tooling — see
      # docs/FDroid-Submission-Plan.md.
      - run: ./gradlew :app:minifyFullReleaseWithR8 --stacktrace
      - run: ./gradlew :app:bundleFullRelease --stacktrace
      - name: Generate checksums
        shell: bash
        run: |
          mkdir -p release-artifacts
          find app/build/outputs -type f \( -name '*.aab' -o -name '*.apk' \) -print0 | sort -z | xargs -0 -r sha256sum > release-artifacts/SHA256SUMS.txt
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: release-artifacts/tigerplayer-sbom.spdx.json
          upload-artifact: "false"
          upload-release-assets: "false"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-release-${{ github.sha }}
          path: |
            app/build/outputs/bundle/fullRelease/*.aab
            app/build/outputs/mapping/fullRelease/mapping.txt
            release-artifacts/SHA256SUMS.txt
            release-artifacts/tigerplayer-sbom.spdx.json
          if-no-files-found: error
          retention-days: 30
