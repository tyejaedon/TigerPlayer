name: Release candidate
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch, or tag to build.
        required: true
        default: master
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release-candidate:
    name: Build unsigned release candidate
    runs-on: ubuntu-latest
    environment: release-candidate
    timeout-minutes: 45
    # Override the workflow-level `contents: read` so the tag-triggered run can
    # publish artifacts to the GitHub Release. Still no signing secrets are read.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-android-build
        with:
          cache-read-only: "false"
      - run: ./gradlew --dependency-verification=strict help --stacktrace
      # `full` is the distributable flavor for tagged releases (includes Spotify App Remote).
      # `foss` is F-Droid's reproducible flavor (no proprietary deps/keys required) — it's built
      # here too purely so both flavors' APKs are attached to the GitHub Release; F-Droid's own
      # infrastructure independently builds and signs `foss` from source (see
      # docs/FDroid-Submission-Plan.md), this job's foss APK is just unsigned convenience evidence.
      - run: ./gradlew :app:minifyFullReleaseWithR8 :app:minifyFossReleaseWithR8 --stacktrace
      - run: ./gradlew :app:bundleFullRelease --stacktrace
      # Sideloadable unsigned APKs, in addition to the Play-style AAB, so the
      # release-candidate evidence is directly installable for manual verification —
      # one per distribution flavor (AGP names each file with its flavor already).
      - run: ./gradlew :app:assembleFullRelease :app:assembleFossRelease --stacktrace
      - name: Generate checksums
        shell: bash
        run: |
          mkdir -p release-artifacts
          find app/build/outputs -type f \( -name '*.aab' -o -name '*.apk' \) -print0 | sort -z | xargs -0 -r sha256sum > release-artifacts/SHA256SUMS.txt
          # Both flavors' R8 mapping files are literally named "mapping.txt" — copy them to
          # distinct names before upload, since GitHub Release assets must have unique names
          # within a release (uploading two same-named files in one batch 404s on the second).
          cp app/build/outputs/mapping/fullRelease/mapping.txt release-artifacts/mapping-full.txt
          cp app/build/outputs/mapping/fossRelease/mapping.txt release-artifacts/mapping-foss.txt
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: release-artifacts/tigerplayer-sbom.spdx.json
          upload-artifact: "false"
          upload-release-assets: "false"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-release-${{ github.sha }}
          path: |
            app/build/outputs/apk/full/release/*.apk
            app/build/outputs/apk/foss/release/*.apk
            app/build/outputs/bundle/fullRelease/*.aab
            release-artifacts/mapping-full.txt
            release-artifacts/mapping-foss.txt
            release-artifacts/SHA256SUMS.txt
            release-artifacts/tigerplayer-sbom.spdx.json
          if-no-files-found: error
          retention-days: 30
      # Attach the same unsigned evidence to the GitHub Release for the resolved
      # tag. Two ways to reach a tag here:
      #   1. A real `push: tags: [v*]` event — `github.ref` is `refs/tags/<tag>`.
      #   2. A manual `workflow_dispatch` re-run to backfill assets onto a tag
      #      whose original run predates this publishing step (or predates a
      #      later addition like the foss APK) — `github.ref` is whatever ref
      #      the run was dispatched from, which does NOT reflect the `ref`
      #      input, so it's resolved from `inputs.ref` instead when that looks
      #      like a `v*` tag. Dispatch with `-f ref=v2.1.2` (and no need to
      #      change the "Use workflow from" branch, since checkout already
      #      uses `inputs.ref`) to backfill an existing tag's release.
      # A `workflow_dispatch` run left at the default `master` ref intentionally
      # does not publish anywhere — there is no tag to attach to. No signing
      # keys are read either way; assets are clearly unsigned build evidence,
      # not a production distribution artifact.
      - name: Publish unsigned APK/AAB to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=""
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          elif [[ "${{ inputs.ref }}" == v* ]]; then
            tag="${{ inputs.ref }}"
          fi
          if [[ -z "$tag" ]]; then
            echo "No tag resolved from github.ref or the 'ref' input; skipping GitHub Release publish."
            exit 0
          fi
          assets=(
            app/build/outputs/apk/full/release/*.apk
            app/build/outputs/apk/foss/release/*.apk
            app/build/outputs/bundle/fullRelease/*.aab
            release-artifacts/mapping-full.txt
            release-artifacts/mapping-foss.txt
            release-artifacts/SHA256SUMS.txt
            release-artifacts/tigerplayer-sbom.spdx.json
          )
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --verify-tag \
              --notes "Unsigned release-candidate evidence for ${tag}: full and foss flavor APKs, the full flavor AAB, R8 mapping files, SHA-256 checksums, and SPDX SBOM. These artifacts are unsigned build output for verification only — not a signed production distribution."
          fi
