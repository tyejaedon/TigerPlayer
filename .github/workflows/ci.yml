name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

# Cancel superseded runs on the same PR/branch to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    name: Build, unit test, and lint (foss)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Deliberately does NOT provide secrets.properties: the foss flavor must build without it.
      - name: Assemble foss debug
        run: ./gradlew :app:assembleFossDebug --stacktrace

      - name: Unit test (foss)
        run: ./gradlew :app:testFossDebugUnitTest --stacktrace

      - name: Lint (foss)
        run: ./gradlew :app:lintFossDebug --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-fossDebug.html
          retention-days: 14

